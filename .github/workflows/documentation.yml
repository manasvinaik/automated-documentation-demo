name: Automated Documentation

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  documentation:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install MkDocs
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      # 4. Install Doxygen
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      # 5. Generate README
      - name: Generate README
        run: |
          python scripts/generate_readme.py

      # 6. Create Doxygen output directory
      - name: Create Doxygen directory
        run: |
          mkdir -p docs/doxygen

      # 7. Generate technical documentation
      - name: Generate Doxygen documentation
        run: |
          doxygen Doxyfile

      # 8. Build MkDocs website
      - name: Build MkDocs
        run: |
          echo "${{ github.sha }}" > site/version.txt

      # 9. Copy Doxygen documentation into the MkDocs site
      - name: Copy Doxygen documentation
        run: |
          mkdir -p site/doxygen
          cp -r docs/doxygen/html site/doxygen/

      # 10. Save generated README
      - name: Commit generated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "docs: update generated README"

          git push

      # 11. Upload MkDocs website
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # 12. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4