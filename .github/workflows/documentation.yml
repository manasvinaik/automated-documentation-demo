name: Automated Documentation

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  documentation:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install MkDocs
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      # 4. Install Doxygen
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      # 5. Generate README
      - name: Generate README
        run: |
          python scripts/generate_readme.py

      # 6. Create Doxygen output directory
      - name: Create Doxygen directory
        run: |
          mkdir -p docs/doxygen

      # 7. Generate technical documentation
      - name: Generate Doxygen documentation
        run: |
          doxygen Doxyfile

      # 8. Build MkDocs website
      - name: Build MkDocs
        run: |
          mkdocs build

      # 9. Copy Doxygen documentation into the MkDocs site
      - name: Copy Doxygen documentation
        run: |
          mkdir -p site/doxygen
          cp -r docs/doxygen/html site/doxygen/

      # 10. Verify generated Doxygen documentation
      - name: Verify Doxygen output
        run: |
          echo "========================================"
          echo "CHECKING SOURCE CODE"
          echo "========================================"

          grep -n "percentage" src/calculator.py

          echo ""
          echo "========================================"
          echo "CHECKING DOXYGEN OUTPUT"
          echo "========================================"

          ls -la site/doxygen/html

          echo ""
          echo "Searching generated documentation for percentage..."

          if grep -R "percentage" site/doxygen/html; then
            echo ""
            echo "SUCCESS: percentage() was found in generated Doxygen documentation."
          else
            echo ""
            echo "ERROR: percentage() was NOT found in generated Doxygen documentation."
            exit 1
          fi

      # 11. Verify final MkDocs site
      - name: Verify MkDocs site
        run: |
          echo "========================================"
          echo "CHECKING FINAL SITE"
          echo "========================================"

          test -f site/doxygen/html/index.html

          echo "Doxygen index exists."

          echo ""
          echo "Searching final deployed site for percentage..."

          if grep -R "percentage" site/doxygen/html; then
            echo ""
            echo "SUCCESS: percentage() is present in the final Pages artifact."
          else
            echo ""
            echo "ERROR: percentage() is missing from the final Pages artifact."
            exit 1
          fi

      # 12. Save generated README
      - name: Commit generated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "docs: update generated README"

          git push

      # 13. Upload MkDocs website
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # 14. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4